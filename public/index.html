<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S0ulm0n Solar Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-area">
                <h1>Dashboard</h1>
            </div>
            <div class="actions" style="display: flex; gap: 10px;">
                <button id="btn-email" class="btn-primary">
                    <span class="btn-text">Send Report</span>
                    <span class="loader hidden"></span>
                </button>
                <a href="/settings" class="btn-secondary">Settings</a>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading-overlay" class="active">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary); text-align: center;">Fetching latest stats...</p>
        </div>

        <!-- Dashboard Content -->
        <main id="dashboard" class="hidden">
            <div class="stats-grid">
                <div class="stat-card fade-in delay-1">
                    <h3>Today's Yield</h3>
                    <div class="value" id="val-today">0.00 <span class="unit">kWh</span></div>
                </div>
                <div class="stat-card fade-in delay-2">
                    <h3>Live Power</h3>
                    <div class="value" id="val-live">0.00 <span class="unit">kW</span></div>
                </div>
                <div class="stat-card fade-in delay-3">
                    <h3>This Month</h3>
                    <div class="value" id="val-month">0.00 <span class="unit">kWh</span></div>
                </div>
                <div class="stat-card fade-in delay-4">
                    <h3>Lifetime Yield</h3>
                    <div class="value" id="val-total">0.00 <span class="unit">kWh</span></div>
                </div>
                <div class="stat-card fade-in delay-5">
                    <h3>CO₂ Avoided</h3>
                    <div class="value" id="val-co2">- <span class="unit">kg</span></div>
                </div>
                <div class="stat-card fade-in delay-6">
                    <h3>System Status</h3>
                    <div class="value" id="val-status" style="font-size: 1.25rem;">-</div>
                </div>
            </div>

            <div class="charts-section fade-in delay-5">
                <div class="chart-container">
                    <h2 class="chart-title">7-Day Trend</h2>
                    <div class="canvas-wrapper">
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="heatmap-section fade-in delay-5" style="margin-top: 1.5rem;">
                <div class="chart-container">
                    <div class="heatmap-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h2 class="chart-title" style="margin: 0;">Generation Heatmap (90 Days)</h2>
                        <div class="heatmap-legend">
                            <span class="legend-label">Less</span>
                            <span class="legend-cell lvl-0"></span>
                            <span class="legend-cell lvl-1"></span>
                            <span class="legend-cell lvl-2"></span>
                            <span class="legend-cell lvl-3"></span>
                            <span class="legend-cell lvl-4"></span>
                            <span class="legend-label">More</span>
                        </div>
                    </div>
                    <div id="heatmap-container" class="heatmap-wrapper">
                        <div class="heatmap-loading" id="heatmap-loading">
                            <div class="spinner small"></div>
                            <span style="color: var(--text-secondary); font-size: 0.85rem;">Loading solar calendar...</span>
                        </div>
                        <div id="heatmap-grid" class="heatmap-grid hidden"></div>
                    </div>
                </div>
            </div>
            
            <div id="toast" class="toast hidden"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
