<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - S0ulm0n Solar Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-container {
            max-width: 800px;
            margin: 40px auto;
        }
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-section h2 {
            margin-bottom: 20px;
            font-family: 'Outfit', sans-serif;
            color: #e2e8f0;
            font-size: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-family: 'Outfit', sans-serif;
            color: #94a3b8;
            font-size: 14px;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .toggle-label {
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }
        
        .switch {
          position: relative;
          display: inline-block;
          width: 50px;
          height: 24px;
        }
        .switch input { 
          opacity: 0;
          width: 0;
          height: 0;
        }
        .slider {
          position: absolute;
          cursor: pointer;
          top: 0; left: 0; right: 0; bottom: 0;
          background-color: #334155;
          transition: .4s;
          border-radius: 24px;
        }
        .slider:before {
          position: absolute;
          content: "";
          height: 18px;
          width: 18px;
          left: 3px;
          bottom: 3px;
          background-color: white;
          transition: .4s;
          border-radius: 50%;
        }
        input:checked + .slider {
          background-color: #3b82f6;
        }
        input:checked + .slider:before {
          transform: translateX(26px);
        }
    </style>
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>
    
    <div class="container settings-container">
        <header>
            <div class="title-area">
                <h1>Account <span>Settings</span></h1>
            </div>
            <div class="actions">
                <a href="/index.html" class="btn-primary" style="text-decoration: none;">Dashboard</a>
                <button id="btn-logout" class="btn-primary" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #fca5a5;">Logout</button>
            </div>
        </header>

        <div class="glass-card fade-in">
            <form id="settings-form">
                
                <div class="form-section">
                    <h2>Email Notifications</h2>
                    <div class="toggle-container">
                        <label class="switch">
                            <input type="checkbox" id="receive-emails">
                            <span class="slider"></span>
                        </label>
                        <span class="toggle-label">Send me daily generation reports</span>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Renac Credentials</h2>
                    <div class="form-group">
                        <label>Email / Username</label>
                        <input type="text" id="renac-username" placeholder="Renac account email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="renac-password" placeholder="Renac password">
                    </div>
                    <div class="form-group">
                        <label>Station ID</label>
                        <input type="text" id="renac-station" placeholder="e.g. 149199">
                    </div>
                </div>

                <div class="form-section">
                    <h2>ShineMonitor Credentials</h2>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="shine-username" placeholder="ShineMonitor username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="shine-password" placeholder="ShineMonitor password">
                    </div>
                    <div class="form-group">
                        <label>Company Key</label>
                        <input type="text" id="shine-company" placeholder="e.g. bnrl_frRFjEz8Mkn">
                    </div>
                    <div class="form-group">
                        <label>Plant ID</label>
                        <input type="text" id="shine-plant" placeholder="e.g. 1301951">
                    </div>
                </div>

                <button id="btn-save" class="btn-primary" type="button" style="width: 100%; justify-content: center; padding: 14px;">
                    <span class="btn-text">Save Settings</span>
                    <span class="loader hidden"></span>
                </button>
                
            </form>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="settings.js"></script>
</body>
</html>
