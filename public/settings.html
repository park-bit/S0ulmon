<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - S0ulm0n Solar Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-container {
            max-width: 600px;
        }
        .settings-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
        }
        .settings-section:last-child {
            border-bottom: none;
        }
        .settings-section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--card-bg);
            transition: .2s;
            border-radius: 24px;
            border: 1px solid var(--card-border);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-secondary);
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container settings-container">
        <header>
            <div class="title-area">
                <h1>Settings</h1>
            </div>
            <div class="actions">
                <a href="/" class="btn-secondary">Back</a>
            </div>
        </header>

        <main class="card fade-in">
            <form id="settings-form" onsubmit="event.preventDefault(); saveSettings();">
                
                <div class="settings-section">
                    <h2>Notifications</h2>
                    <div class="form-row">
                        <div>
                            <label style="color: var(--text-primary); font-weight: 500;">Email Reports</label>
                            <p style="color: var(--text-secondary); font-size: 0.85rem;">Receive daily generation reports via email.</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="receive-emails">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="settings-section">
                    <h2>RENAC Credentials</h2>
                    <div class="form-group">
                        <label for="renac-username">Username (Email)</label>
                        <input type="email" id="renac-username" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="renac-password">Password</label>
                        <input type="password" id="renac-password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="renac-station">Station ID (Optional)</label>
                        <input type="text" id="renac-station" placeholder="Leave blank to auto-detect">
                    </div>
                </div>

                <div class="settings-section">
                    <h2>ShineMonitor Credentials</h2>
                    <div class="form-group">
                        <label for="shine-username">Username</label>
                        <input type="text" id="shine-username" placeholder="username">
                    </div>
                    <div class="form-group">
                        <label for="shine-password">Password</label>
                        <input type="password" id="shine-password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="shine-company">Company Key</label>
                        <input type="text" id="shine-company" placeholder="Company Key">
                    </div>
                    <div class="form-group">
                        <label for="shine-plant">Plant ID (Optional)</label>
                        <input type="text" id="shine-plant" placeholder="Leave blank to auto-detect">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btn-logout" class="btn-secondary" onclick="logout()">Log Out</button>
                    <button type="submit" id="btn-save" class="btn-primary">
                        <span class="btn-text">Save Changes</span>
                        <span class="loader hidden"></span>
                    </button>
                </div>
            </form>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="settings.js"></script>
</body>
</html>
